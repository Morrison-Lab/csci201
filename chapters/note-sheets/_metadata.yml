# Shared settings for the exam note sheets.
# Each sheet renders as a web page and as a compact PDF to print.
# The layout follows the lds note sheets: one column, 7pt type, narrow margins,
# and label | formula tables with bold captions above them.
# One column because pipe tables become longtables, which LaTeX cannot set in two columns.
number-sections: false
format:
  html: default
  pdf:
    toc: false
    # A printed sheet needs no last-modified stamp.
    date: ""
    # Quarto's default class (KOMA scrartcl) takes any size;
    # extarticle has no 7pt option and would fall back to 10pt.
    fontsize: 7pt
    links-as-notes: false
    geometry:
      - top=0.25in
      - bottom=0.25in
      - left=0.5in
      - right=0.5in
    include-in-header:
      text: |
        \renewcommand{\arraystretch}{0.9}
        \setlength{\parskip}{0pt}
        \setlength{\LTpre}{0pt}
        \setlength{\LTpost}{3pt}
        \setlength{\LTleft}{0pt}
        \setlength{\LTright}{0pt}
        \pagestyle{empty}
        \usepackage{needspace}
        \usepackage{titling}
        \setlength{\droptitle}{-5em}
        \posttitle{\par\end{center}\vspace{-4em}}
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\setlength{\abovedisplayskip}{0pt}}
        \usepackage{caption}
        \captionsetup[table]{font=bf,skip=0pt,position=top}
