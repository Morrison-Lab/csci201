# Lychee configuration file
# Documentation: https://github.com/lycheeverse/lychee#configuration-file

# Maximum number of retries per link
max_retries = 3

# Maximum number of concurrent requests
max_concurrency = 10

# User agent string
user_agent = "Mozilla/5.0 (compatible; Lychee/0.15; +https://github.com/lycheeverse/lychee)"

# Accept these HTTP status codes as valid
accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308, 429]

# Timeout per request (in seconds)
timeout = 20

# Exclude template URLs that users should replace
exclude = [
  "https://github.com/YOUR-USERNAME/.*",
  "https://YOUR-USERNAME.github.io/.*",
  "https://your-username.github.io/.*",
  "http://localhost.*",
  "https://localhost.*",
  "http://127.0.0.1.*",
  "https://127.0.0.1.*",
  # quarto.org is a trusted site but may be unreachable from CI runners
  "https://quarto.org/.*",
  # These syllabus pages load in a browser but answer CI's link checker with
  # 403 Forbidden (the same exclusions as mcs).
  "https://www.acm.org/code-of-ethics",
  "https://www.wwu.edu/dean-students",
  # web.stanford.edu serves a certificate chain CI's link checker cannot verify.
  "https://web.stanford.edu/.*",
  # The self-test's PDF links to the page's own web copy, which cannot exist on
  # the published site until the PR that adds the page merges and deploys.
  "https://morrison-lab.github.io/csci201/chapters/prerequisite-self-test.html",
]
